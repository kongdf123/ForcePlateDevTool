name: ForcePlateDevTool CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ForcePlateDevTool.csproj

      - name: Build
        run: >
          dotnet build ForcePlateDevTool.csproj
          --configuration ${{ matrix.configuration }}
          --no-restore

      - name: Upload build output
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ForcePlateDevTool-Release
          path: bin/Release/net8.0-windows/
          if-no-files-found: error