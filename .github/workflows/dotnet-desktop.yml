name: ForcePlateDevTool CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore ForcePlateDevTool.sln

      - name: Build solution
        run: >
          dotnet build ForcePlateDevTool.sln
          --configuration ${{ matrix.configuration }}
          --no-restore

      - name: Run tests
        run: >
          dotnet test tests/ForcePlateDevTool.Tests/ForcePlateDevTool.Tests.csproj
          --configuration ${{ matrix.configuration }}
          --no-build
          --logger "console;verbosity=normal"

      - name: Upload CI build (for testing only, not a release)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ForcePlateDevTool-CI-build
          path: src/ForcePlateDevTool/bin/Release/net8.0-windows/
          if-no-files-found: error