name: Release ForcePlateDevTool

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  INNO_SETUP_VERSION: "6.4.0"
  TIMESTAMP_URL: "http://timestamp.digicert.com"

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: dotnet-cache-release-${{ runner.os }}-${{ hashFiles('**/Directory.Build.props','**/*.csproj') }}
          restore-keys: |
            dotnet-cache-release-${{ runner.os }}-

      - name: Validate release tag and source branch
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Use a stable release tag such as v1.2.0"
          }

          $version = $tag.Substring(1)
          $parts = $version.Split('.')
          $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch main"
          }

          Write-Host "Tagged commit: $env:GITHUB_SHA"
          Write-Host "main tip: $(git rev-parse origin/main)"

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from main"
          }

          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "ASSEMBLY_VERSION=$assemblyVersion" | Out-File $env:GITHUB_ENV -Append
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0, 7))" | Out-File $env:GITHUB_ENV -Append

      - name: Restore solution
        run: dotnet restore ForcePlateDevTool.sln

      - name: Run tests
        run: dotnet test ForcePlateDevTool.sln --configuration Release --no-restore

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish"
          $project = "src/ForcePlateDevTool/ForcePlateDevTool.csproj"
          $infoVersion = "$($env:RELEASE_VERSION)+$($env:SHORT_SHA)"

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $publishDir
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          dotnet publish $project `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDir `
            "-p:Version=$env:RELEASE_VERSION" `
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:ASSEMBLY_VERSION" `
            "-p:InformationalVersion=$infoVersion"

          if ($LASTEXITCODE -ne 0) {
            throw "Publish failed"
          }

          @(
            "Application: ForcePlateDevTool"
            "Version: $env:RELEASE_VERSION"
            "InformationalVersion: $infoVersion"
            "GitTag: $env:RELEASE_TAG"
            "Commit: $env:GITHUB_SHA"
            "Runtime: win-x64"
            "Deployment: self-contained portable ZIP"
            "BuildTimeUtc: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))"
          ) | Set-Content "$publishDir/VERSION.txt" -Encoding utf8

          @(
            "ForcePlateDevTool $env:RELEASE_VERSION"
            ""
            "Extract the complete ZIP package into a folder."
            "Run ForcePlateDevTool.exe from that folder."
            "Keep all packaged files together."
            ""
            "See VERSION.txt for build and source information."
          ) | Set-Content "$publishDir/README.txt" -Encoding utf8

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version="$env:INNO_SETUP_VERSION" --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install pinned Inno Setup $env:INNO_SETUP_VERSION"
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          "ISCC=$iscc" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Inno Setup version pinned to $env:INNO_SETUP_VERSION"
          Write-Host "ISCC compiler path: $iscc"
          (Get-Item $iscc).VersionInfo | Select-Object FileVersion, ProductVersion | Format-List

      - name: Prepare code signing certificate
        shell: pwsh
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_PFX -or -not $env:CODESIGN_PASSWORD) {
            Write-Host "Code signing secrets not configured; skipping signing steps."
            "SIGNING_ENABLED=false" | Out-File $env:GITHUB_ENV -Append
            return
          }

          "SIGNING_ENABLED=true" | Out-File $env:GITHUB_ENV -Append

          # Normalize the secret: accept raw Base64, PEM-armoured Base64, data URIs,
          # URL-safe Base64, and Base64 wrapped over multiple lines.
          $pfxBase64 = $env:CODE_SIGN_PFX.Trim()
          if ($pfxBase64 -match '(?s)-----BEGIN[^-]*-----(.+?)-----END[^-]*-----') {
            $pfxBase64 = $Matches[1]
          }
          elseif ($pfxBase64 -match '(?i)base64[,:]\s*([A-Za-z0-9+/_=\s-]+)') {
            $pfxBase64 = $Matches[1]
          }
          $pfxBase64 = ($pfxBase64 -replace '\s', '')
          $pfxBase64 = $pfxBase64 -replace '-', '+' -replace '_', '/'
          $pfxBase64 = ($pfxBase64 -replace '[^A-Za-z0-9+/=]', '')
          $pfxBase64 = $pfxBase64.TrimEnd('=')
          $pfxBase64 = $pfxBase64.PadRight([math]::Ceiling($pfxBase64.Length / 4) * 4, '=')

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
          }
          catch {
            throw "CODE_SIGN_PFX secret is not valid Base64: $($_.Exception.Message)"
          }

          # Sanity-check the decoded payload before handing it to signtool.
          $bytes = [IO.File]::ReadAllBytes($pfxPath)
          Write-Host "Decoded certificate size: $($bytes.Length) bytes"
          if ($bytes.Length -lt 64) {
            throw "Decoded certificate is only $($bytes.Length) bytes - CODE_SIGN_PFX must contain the Base64 encoding of the .pfx binary."
          }

          $firstBytes = ($bytes[0..7] | ForEach-Object { $_.ToString('X2') }) -join ' '
          Write-Host "First bytes: $firstBytes"
          if ($bytes[0] -ne 0x30) {
            $head = [Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(80, $bytes.Length))
            $msg = "Decoded data is not a PKCS#12 PFX (expected DER SEQUENCE tag 0x30, got 0x$('{0:X2}' -f $bytes[0]); head: '$head'). "
            $msg += "CODE_SIGN_PFX must be the Base64 encoding of the .pfx binary itself, not a .cer/.pem export."
            throw $msg
          }

          # Load via the same Windows CryptoAPI code path signtool uses, so a wrong
          # password or unsupported encryption fails here with a clear message.
          $certs = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
          try {
            $certs.Import($pfxPath, $env:CODESIGN_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
          }
          catch {
            $reason = $_.Exception.Message
            if ($_.Exception.InnerException) { $reason = $_.Exception.InnerException.Message }
            Write-Host "PFX import failure: $reason"
            $msg = "The code signing PFX could not be loaded (underlying error: $reason). Likely causes: "
            $msg += "1) CODESIGN_PASSWORD does not exactly match the PFX export password (watch for trailing spaces/newlines in the secret); "
            $msg += "2) the PFX uses OpenSSL 3.x defaults (PBES2/AES) that signtool rejects - re-export with: "
            $msg += "openssl pkcs12 -export -in cert.pem -inkey key.pem -out codesign.pfx -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1"
            throw $msg
          }

          $signer = $certs | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $signer) {
            throw "The PFX contains no certificate with a private key. Re-export it including the private key."
          }

          Write-Host "Signing certificate loaded successfully:"
          Write-Host "  Subject:    $($signer.Subject)"
          Write-Host "  Thumbprint: $($signer.Thumbprint)"
          Write-Host "  Valid:      $($signer.NotBefore) - $($signer.NotAfter)"
          if ($signer.NotAfter -lt [DateTime]::Now) {
            Write-Host "::warning::The code signing certificate has EXPIRED ($($signer.NotAfter))"
          }

          "CODE_SIGN_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append

      - name: Sign primary application EXE
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $appExe = "artifacts/publish/ForcePlateDevTool.exe"
          if (-not (Test-Path $appExe)) {
            throw "Application EXE not found for signing: $appExe"
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            throw "SignTool not found under Windows Kits"
          }

          & $signtool sign `
            /f $env:CODE_SIGN_PFX_PATH `
            /p $env:CODESIGN_PASSWORD `
            /fd SHA256 `
            /tr $env:TIMESTAMP_URL `
            /td SHA256 `
            $appExe

          if ($LASTEXITCODE -ne 0) {
            throw "Application signing failed"
          }

          # No signtool verify: the signing chain roots at the Kunwei QA Internal CA,
          # which is not in the runner's trust store, so /pa would report UntrustedRoot.

          "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append

      - name: Build installer, ZIP, and SHA-256 checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $version = $env:RELEASE_VERSION
          $iscc = $env:ISCC
          $zip = "artifacts/ForcePlateDevTool-v$version-win-x64.zip"
          $setup = "artifacts/ForcePlateDevTool-Setup-v$version.exe"

          Write-Host "Compiling installer with ISCC: $iscc"
          & $iscc "installer/ForcePlateDevTool.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

          if (-not (Test-Path $setup)) {
            throw "Installer output not found: $setup"
          }

          if ($env:SIGNING_ENABLED -eq "true") {
            $signtool = $env:SIGNTOOL
            if (-not $signtool) {
              throw "SignTool path not available for installer signing"
            }

            try {
              & $signtool sign `
                /f $env:CODE_SIGN_PFX_PATH `
                /p $env:CODESIGN_PASSWORD `
                /fd SHA256 `
                /tr $env:TIMESTAMP_URL `
                /td SHA256 `
                $setup

              if ($LASTEXITCODE -ne 0) {
                throw "Installer signing failed"
              }

              # No signtool verify here either - same untrusted internal root CA reason.
            } finally {
              Remove-Item $env:CODE_SIGN_PFX_PATH -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "Signing not enabled; installer remains unsigned."
          }

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "ZIP creation failed: $zip"
          }

          foreach ($file in @($zip, $setup)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
          }

          "RELEASE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_SETUP=$setup" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_ZIP_CHECKSUM=$zip.sha256" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_SETUP_CHECKSUM=$setup.sha256" | Out-File $env:GITHUB_ENV -Append

      - name: Scan artifacts with Microsoft Defender
        shell: pwsh
        run: |
          $scanTargets = @(
            "artifacts/publish/ForcePlateDevTool.exe",
            $env:RELEASE_SETUP,
            $env:RELEASE_ZIP
          ) | Where-Object { Test-Path $_ }

          if ($scanTargets.Count -eq 0) {
            throw "No scan targets found"
          }

          $mpCmdRun = "${env:ProgramFiles}\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mpCmdRun)) {
            throw "MpCmdRun.exe not found at $mpCmdRun"
          }

          Write-Host "Updating Defender signatures (best effort)..."
          try {
            & $mpCmdRun -SignatureUpdate | Out-Host
          } catch {
            Write-Host "Signature update skipped: $($_.Exception.Message)"
          }

          Write-Host "Running Defender scan on: $($scanTargets -join ', ')"
          foreach ($target in $scanTargets) {
            Write-Host "Scanning $target"
            & $mpCmdRun -Scan -ScanType 3 -File $target
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "Defender scan of $target returned non-zero exit code $code; possible threat detected."
            }
            Write-Host "Clean: $target"
          }

          Write-Host "No Defender threats detected in release artifacts."

          Write-Host "Artifact SHA-256 checksums:"
          foreach ($file in @($env:RELEASE_SETUP, $env:RELEASE_ZIP)) {
            if (Test-Path $file) {
              Write-Host "$((Get-FileHash $file -Algorithm SHA256).Hash)  $(Split-Path $file -Leaf)"
            }
          }

      - name: Create GitHub release (managed action)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "ForcePlateDevTool ${{ env.RELEASE_VERSION }}"
          body: |
            Auto-generated release for ${{ env.RELEASE_VERSION }}.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.RELEASE_SETUP }}
            ${{ env.RELEASE_SETUP_CHECKSUM }}
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP_CHECKSUM }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}